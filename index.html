<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <style>

        * {

            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fundo do Site Estilo Praia do GTA 5 */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(20, 0, 0, 0.9)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: rgba(18, 18, 18, 0.95);
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #ff0000;
            backdrop-filter: blur(5px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .logo span {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        /* Botão Telefone Topo */
        .btn-assessoria {
            background-color: #000000; 
            color: #ff0000; 
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            transition: 0.3s;
            border: 2px solid #ff0000; 
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6), inset 0 0 10px rgba(255, 0, 0, 0.4); 
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.8);
        }

        .btn-assessoria:hover {
            background-color: #ff0000;
            color: #000000;

        /* Seção Principal */

            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 2px solid #ff0000;
        }

        .hero h1 {

            margin-bottom: 20px;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 0, 0, 0.4);
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 35px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* Container do Simulador */
        .simulador-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: rgba(18, 18, 18, 0.92);
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .simulador-container h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ddd;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: rgba(34, 34, 34, 0.9);
            border: 1px solid #555;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #ff0000;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        .resultado-box {
            background-color: #000;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #ff0000;
        }

        .resultado-box p {
            font-size: 16px;
            color: #fff;
        }

        .resultado-box span {
            font-size: 22px;
            font-weight: bold;
            color: #ff0000;
            display: block;
            margin-top: 5px;
        }

        .btn-simulador {
            display: block;
            width: 100%;
            background-color: #ff0000;
            color: #fff;
            text-align: center;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            text-decoration: none;
        }

        .btn-simulador:hover {
            background-color: #b30000;
        }

        /* Seção de Serviços */
        .servicos-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .servicos-section h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .subtitle {
            text-align: center;
            color: #ddd;
            margin-bottom: 40px;
        }

        .grid-servicos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card-servico {
            background: rgba(18, 18, 18, 0.88);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: left;
            border-top: 5px solid #ff0000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
        }

        .card-servico:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.3);
        }

        .card-servico h3 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-servico p {
            color: #e0e0e0;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-card {
            background-color: rgba(34, 34, 34, 0.8);
            color: #ff0000;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid #ff0000;
        }

        .btn-card:hover {
            background-color: #ff0000;
            color: #ffffff;
        }

        .card-destaque {
            border-top-color: #ffffff;
            background-color: rgba(40, 10, 10, 0.88);
        }

        footer {
            background-color: rgba(0, 0, 0, 0.95);
            color: #aaa;
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
            margin-top: 60px;
            border-top: 3px solid #ff0000;
        }

        footer p {
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .nav-container { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
