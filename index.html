<!DOCTYPE html>

        /* Animação União RGB Infinita */
        @keyframes rgb-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }

        @keyframes rgb-text {

            33% { color: #00ff00; text-shadow: 0 0 8px #00ff00; }
            66% { color: #0000ff; text-shadow: 0 0 8px #0000ff; }
            100% { color: #ff0000; text-shadow: 0 0 8px #ff0000; }

        /* Cabeçalho */
        header {

        }

            margin-bottom: 5px;
            font-weight: bold;
            color: #aaa;

        }

        .form-group input, .form-group select {

            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;

            margin-top: 25px;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
        }

        .btn-simulador:hover {

            color: #000;

        /* Seção de Serviços */

            font-size: 32px;
            margin-bottom: 40px;
            color: #ffffff;
        }

        .grid-servicos {
            display: grid;

        }

        .card-servico {
